<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"/>
<meta name="theme-color" content="#0A0A0A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MuscleTrack"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="description" content="6-day split leg workout tracking app by Hemanth"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232ECC71' width='192' height='192' rx='45'/><text x='96' y='96' font-size='140' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>💪</text></svg>"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232ECC71' width='180' height='180' rx='40'/><text x='90' y='90' font-size='130' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>💪</text></svg>"/>
<title>MuscleTrack - Workout Plan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#FF4D4D;--blue:#3B9EE8;--green:#2ECC71;--purple:#A855F7;--orange:#F97316;--gold:#F59E0B;--pink:#EC4899;--teal:#14B8A6;--bg:#0A0A0A;--card:#141414;--card2:#1C1C1C;--border:#272727;--muted:#555;--sub:#888;--text:#F0F0F0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow-x:hidden;position:fixed}
body{overflow-y:auto;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.header{background:#111;padding:env(safe-area-inset-top,14px) 14px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px}
.header-left{display:flex;align-items:center;gap:10px}
.logo-box{width:34px;height:34px;background:linear-gradient(135deg,var(--green),var(--teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.app-name{font-size:18px;font-weight:900;letter-spacing:-0.5px}
.app-sub{font-size:9px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.hbtn{width:36px;height:36px;border-radius:10px;background:#1e1e1e;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;flex-shrink:0}
.ndot{position:absolute;top:5px;right:5px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid #111;display:none}
.avatar-btn{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--blue));border:2px solid var(--purple);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 8px 9px;border-bottom:3px solid transparent;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);min-width:56px;text-align:center;transition:color 0.15s}
.tab.active{color:#fff}
.tab-day{font-size:7px;margin-bottom:2px;font-weight:700;letter-spacing:1px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);transition:color 0.15s}
.bnav-btn.active{color:var(--green)}
.bnav-icon{font-size:20px;line-height:1}
.page{display:none;max-width:600px;margin:0 auto;padding:16px 14px 90px}
.page.active{display:block}
.hero{border-radius:18px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-bg{position:absolute;right:-8px;top:-8px;font-size:100px;opacity:0.07;line-height:1;pointer-events:none}
.hero-eyebrow{font-size:9px;letter-spacing:3px;opacity:0.7;text-transform:uppercase;margin-bottom:3px}
.hero-title{font-size:26px;font-weight:900;letter-spacing:-1px}
.hero-day{font-size:13px;opacity:0.8;margin-top:2px;font-weight:700}
.hero-focus{font-size:11px;opacity:0.7;margin-top:2px}
.hero-note{margin-top:12px;background:rgba(0,0,0,0.22);border-radius:10px;padding:9px 12px;font-size:11px;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div class="logo-box">💪</div>
      <div>
        <div class="app-name">MuscleTrack</div>
        <div class="app-sub" id="greeting">Good morning!</div>
      </div>
    </div>
    <div class="header-right">
      <button class="hbtn">🔔<div class="ndot" id="ndot"></div></button>
      <button class="avatar-btn" id="avatarBtn">💪</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="page active" id="page-workout"></div>

<nav class="bnav">
  <button class="bnav-btn active" id="nav-workout"><span class="bnav-icon">🏋️</span>Workout</button>
  <button class="bnav-btn" id="nav-history"><span class="bnav-icon">📈</span>History</button>
  <button class="bnav-btn" id="nav-stats"><span class="bnav-icon">⚡</span>Stats</button>
</nav>

<script>
// Service Worker Registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW registration failed:', e));
}

// Prevent zoom
document.addEventListener('touchmove', function(event) {
  if (event.touches.length > 1) {
    event.preventDefault();
  }
}, { passive: false });

document.addEventListener('gesturestart', function(event) {
  event.preventDefault();
});

// Your existing app code here
const PLAN = [
  {day:"Monday",label:"Push",focus:"Chest · Shoulders · Triceps",color:"#FF4D4D"},
  {day:"Tuesday",label:"Pull",focus:"Back · Rear Delts · Biceps",color:"#3B9EE8"},
  {day:"Wednesday",label:"Legs Pt.1",focus:"Squat · Leg Press · Calves",color:"#2ECC71"},
  {day:"Thursday",label:"Face & Neck",focus:"Face · Neck · Jaw · Traps",color:"#EC4899"},
  {day:"Friday",label:"Upper",focus:"Chest · Back · Shoulders — 2nd Hit",color:"#A855F7"},
  {day:"Saturday",label:"Legs+Arms",focus:"Heavy Legs Pt.2 + Biceps + Triceps",color:"#F97316"},
  {day:"Sunday",label:"REST",focus:"Full Recovery Day",color:"#555",isRest:true}
];

let activeDay = 0;

function updateGreeting(){
  const h = new Date().getHours();
  const g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  document.getElementById("greeting").textContent = g + "!";
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = PLAN.map((d, i) => `
    <button class="tab ${i === activeDay ? 'active' : ''}" 
      style="${i === activeDay ? 'border-bottom-color:' + d.color + ';color:#fff' : ''}"
      onclick="activeDay=${i};renderTabs();renderWorkout()">
      <div class="tab-day" style="${i === activeDay ? 'color:' + d.color : ''}">${d.day.slice(0,3).toUpperCase()}</div>
      ${d.label}
    </button>
  `).join("");
}

function renderWorkout(){
  const d = PLAN[activeDay];
  let h = `<div class="hero" style="background:${d.color}">
    <div class="hero-eyebrow">MuscleTrack</div>
    <div class="hero-title">${d.label}</div>
    <div class="hero-day">${d.day}</div>
    <div class="hero-focus">${d.focus}</div>
  </div>`;
  document.getElementById("page-workout").innerHTML = h;
}

updateGreeting();
renderTabs();
renderWorkout();
</script>

</body>
</html>
